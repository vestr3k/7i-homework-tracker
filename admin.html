<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

<header>

<h1>Admin Panel</h1>

<button onclick="location.href='index.html'" id="lockBtn">
??
</button>

</header>

<div class="card">

<h2>Add Homework</h2>

<input id="subject" placeholder="Subject">

<br><br>

<textarea
id="details"
placeholder="Homework Details"
style="width:100%;height:120px;padding:15px;border-radius:15px;border:2px solid #D5A54A;font-size:17px;"
></textarea>

<br><br>

<input id="due" type="date">

<br><br>

<button onclick="addHomework()">

? Add Homework

</button>

</div>

<br>

<div id="adminList">

</div>

<script>

let homework = JSON.parse(localStorage.getItem("homework")) || [];

function save(){

localStorage.setItem(
"homework",
JSON.stringify(homework)
);

}

function display(){

const list=document.getElementById("adminList");

list.innerHTML="";

homework.forEach((hw,index)=>{

list.innerHTML+=`

<div class="card">

<div class="subject">

${hw.subject}

</div>

<div class="details">

${hw.details}

</div>

<div class="due">

?? ${hw.due}

</div>

<br>

<button onclick="editHomework(${index})">

?? Edit

</button>

<button
onclick="deleteHomework(${index})"
style="background:#d9534f;margin-left:10px;">

?? Delete

</button>

</div>

`;

});

}

function addHomework(){

const subject=document.getElementById("subject").value;

const details=document.getElementById("details").value;

const due=document.getElementById("due").value;

if(subject==""||details==""||due==""){

alert("Fill in all fields.");

return;

}

homework.push({

subject,

details,

due

});

save();

display();

document.getElementById("subject").value="";
document.getElementById("details").value="";
document.getElementById("due").value="";

}

function deleteHomework(index){

if(confirm("Delete this homework?")){

homework.splice(index,1);

save();

display();

}

}

function editHomework(index){

const subject=prompt(
"Subject",
homework[index].subject
);

if(subject===null)return;

const details=prompt(
"Details",
homework[index].details
);

if(details===null)return;

const due=prompt(
"Due Date (YYYY-MM-DD)",
homework[index].due
);

if(due===null)return;

homework[index]={

subject,

details,

due

};

save();

display();

}

display();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7I HOMEWORK TRACKER</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<header class="topbar">

<h1>7I HOMEWORK TRACKER</h1>

<button id="lockBtn" class="lock-btn">🔒</button>

</header>

<div class="controls">

<input
type="text"
id="search"
placeholder="Search homework..."
>

<select id="sort">
<option value="soon">Due Soonest</option>
<option value="late">Due Latest</option>
<option value="subject">Subject</option>
</select>

</div>

<div id="homeworkList"></div>

<!-- Admin Login Popup -->

<div id="loginPopup" class="popup">

<div class="popupBox">

<span id="closePopup">&times;</span>

<h2>Admin Access</h2>

<p>Enter password</p>

<input
type="password"
id="adminPassword"
placeholder="Password"
>

<button id="loginBtn">
Login
</button>

</div>

</div>

<script type="module" src="student.js"></script>

</body>
</html>
